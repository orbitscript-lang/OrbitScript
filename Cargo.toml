[workspace]
resolver = "3"
members = ["crates/*"]
# spike/ is its own throwaway workspace (stream S0).
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/tymlipari/OrbitScript"

[workspace.lints.rust]
# Policy (ADR-6): no unsafe code outside the future `orbit-jit` crate.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
