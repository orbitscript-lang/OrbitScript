[workspace]
resolver = "2"
members = ["crates/*"]
# A plain `cargo build --release` at the root builds the CLI (`orbit` and
# `orbitc`) with the features `./build.sh` gives it. Building every member
# turns on orbit-runtime's default features, which changes its symbol names, so
# a PGO profile would miss its functions and LLVM would compile them as cold
# code. `--workspace` still builds and tests everything.
default-members = ["crates/orbit-cli"]
# spike/ is its own throwaway workspace (stream S0).
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/tymlipari/OrbitScript"

[workspace.lints.rust]
# Policy (ADR-6): no unsafe code outside the future `orbit-jit` crate, `orbit-virtmem`, and `orbit-gc`'s memory-trimming.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
