[package]
name = "orbit-lua-syntax"
description = "Lua 5.5 front end: lexer, parser, AST and lowering to the HIR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Numerals and extended UTF-8, read the same way in source and by the runtime.
orbit-lua-text = { path = "../orbit-lua-text" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-version = { path = "../orbit-lua-version" }

[dev-dependencies]
# The nesting tests compile what they lower, since the compiler recurses too.
orbit-compiler = { path = "../orbit-compiler" }

[lints]
workspace = true
