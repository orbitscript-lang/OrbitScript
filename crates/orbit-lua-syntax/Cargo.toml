[package]
name = "orbit-lua-syntax"
description = "Lua 5.5 front end: lexer, parser, AST and lowering to the HIR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-hir = { path = "../orbit-hir" }

[features]
# Parse Lua 5.4 instead of 5.5 (ADR-14): no `global` declarations, no named
# vararg tables, and assignable `for` variables. The whole build targets one
# Lua version; enable it through `orbit`'s feature of the same name.
lua-5-4 = []

[dev-dependencies]
# The nesting tests compile what they lower, since the compiler recurses too.
orbit-compiler = { path = "../orbit-compiler" }

[lints]
workspace = true
