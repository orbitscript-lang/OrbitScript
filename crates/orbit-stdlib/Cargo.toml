[package]
name = "orbit-stdlib"
description = "Lua 5.5 standard library for the OrbitScript VM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-core = { path = "../orbit-core" }
orbit-vm = { path = "../orbit-vm" }

[features]
default = ["coroutine", "debug"]
# The `coroutine` library.
coroutine = []
# The `debug` library.
debug = ["orbit-vm/hooks"]

[lints]
workspace = true
