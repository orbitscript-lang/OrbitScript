[package]
name = "orbit-stdlib"
description = "Lua 5.5 standard library for the OrbitScript VM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-core = { path = "../orbit-core" }
orbit-vm = { path = "../orbit-vm" }

[features]
default = ["load", "os", "package"]
# `load`, `loadfile` and `dofile` (source chunks need the host to install a
# compiler in `Runtime::compile`).
load = []
# The `os` library (without it, no `os` table at all).
os = []
# `require` and the `package` library.
package = ["load"]

[lints]
workspace = true
