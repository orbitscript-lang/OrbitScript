[package]
name = "orbit-bytecode"
description = "The OrbitScript instruction set and unlinked function prototypes, shared by the compiler and the VM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Layer 2 of the bytecode verifier (data flow). Off by default: whoever loads
# binary chunks turns it on (`orbit-runtime`'s `verify-flow`).
verify-flow = []
