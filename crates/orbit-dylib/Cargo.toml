[package]
name = "orbit-dylib"
description = "SPIKE (never merges): the runtime as one Rust dylib that also exports the Lua C API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "orbit"
crate-type = ["dylib"]

[dependencies]
orbit-real = { package = "orbit", path = "../orbit", features = ["c-modules", "ffi"] }
orbit-capi = { path = "../orbit-capi", features = ["host"] }
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }
