[package]
name = "orbit-capi"
description = "Lua 5.5 C API for loading C modules into OrbitScript (ADR-8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
links = "orbit_capi"

[dependencies]
orbit-vm = { path = "../orbit-vm" }
orbit-stdlib = { path = "../orbit-stdlib", default-features = false, features = ["package"] }

[build-dependencies]
cc = "1.2"

# Not the workspace lints: unsafe is denied rather than forbidden, and
# allowed only in src/ffi.rs (ADR-6 exception, Tym 2026-10-10).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
