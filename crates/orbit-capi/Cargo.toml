[package]
name = "orbit-capi"
description = "Lua 5.5 (or 5.4, ADR-14) C API for loading C modules into OrbitScript (ADR-8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
links = "orbit_capi"

[dependencies]
# The public API, for the libraries `orbit-std` builds on it: `luaopen_io`
# and friends open them, and C states are isolates the API can reach.
orbit = { path = "../orbit", default-features = false, features = ["package"] }
orbit-std = { path = "../orbit-std" }
# The Lua version (ADR-14): the build script reads it from its `links`
# metadata, so this must be a direct dependency.
orbit-lua-version = { path = "../orbit-lua-version" }
orbit-dap = { path = "../orbit-dap", optional = true }

[features]
# States created from C (`lua_newstate`, ADR-10): for the shared library
# that programs embedding Lua link to.
host = []
# C states can be debugged (ADR-12): `orbit_debug_listen` and
# `ORBIT_DEBUG` start the DAP server.
debugger = ["host", "orbit/debugger", "dep:orbit-dap"]

[dev-dependencies]
# The tests run on the runtime backend, as the programs' builds select it.
orbit = { path = "../orbit" }
# The C host test speaks DAP to a debugged C state.
serde_json = { version = "1", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1.2"
orbit-lua-version = { path = "../orbit-lua-version" }

# Not the workspace lints: unsafe is denied rather than forbidden, and
# allowed only in src/ffi.rs (ADR-6 exception).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
