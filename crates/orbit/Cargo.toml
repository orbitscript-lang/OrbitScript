[package]
name = "orbit"
description = "Rust embedding API for the OrbitScript runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-compiler = { path = "../orbit-compiler" }
orbit-core = { path = "../orbit-core" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
orbit-stdlib = { path = "../orbit-stdlib", default-features = false }
orbit-vm = { path = "../orbit-vm" }
orbit-capi = { path = "../orbit-capi", optional = true }

[dev-dependencies]
# The verifier tests and the chunk fuzzer measure layer 2 directly.
orbit-bytecode = { path = "../orbit-bytecode", features = ["verify-flow"] }

[features]
# The standard library's optional parts (see `orbit-stdlib`).
default = ["string", "utf8", "table", "math", "load", "os", "package", "coroutine", "debug", "io", "dump", "verify", "verify-flow"]
string = ["orbit-stdlib/string"]
utf8 = ["orbit-stdlib/utf8"]
table = ["orbit-stdlib/table"]
math = ["orbit-stdlib/math"]
load = ["orbit-stdlib/load"]
os = ["orbit-stdlib/os"]
package = ["orbit-stdlib/package"]
coroutine = ["orbit-stdlib/coroutine"]
debug = ["orbit-stdlib/debug"]
io = ["orbit-stdlib/io"]
dump = ["orbit-stdlib/dump"]
verify = ["orbit-stdlib/verify"]
verify-flow = ["orbit-stdlib/verify-flow"]
# Load C modules through the Lua C API (off by default for embedders).
c-modules = ["dep:orbit-capi", "package"]

[lints]
workspace = true
