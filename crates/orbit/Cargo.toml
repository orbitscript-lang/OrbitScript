[package]
name = "orbit"
description = "Rust embedding API for the OrbitScript runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
orbit-runtime = { path = "../orbit-runtime", default-features = false }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }
# The liborbit boundary (ADR-10): declared with it under `abi`, crossed with
# it under `shared`.
stabby = { version = "72.1.16", optional = true }
orbit-jit = { path = "../orbit-jit", optional = true, default-features = false }

[dev-dependencies]
# The verifier tests and the chunk fuzzer measure layer 2 directly.
orbit-bytecode = { path = "../orbit-bytecode", features = ["verify-flow"] }

[features]
# The backend. `runtime` links the runtime into the program; `shared`
# reaches the one in `liborbit` through the boundary instead (ADR-10). With
# both, `runtime` wins, so the features stay additive.
runtime = []
shared = ["dep:stabby"]
# The boundary's declarations and liborbit's half of it, for `orbit-lib`.
abi = ["runtime", "dep:stabby"]
# The standard library's optional parts (see `orbit-runtime`), for the
# runtime backend; a shared build has what liborbit was built with.
default = ["runtime", "string", "utf8", "table", "math", "load", "package", "coroutine", "debug", "dump", "verify", "verify-flow"]
string = ["orbit-runtime/string"]
utf8 = ["orbit-runtime/utf8"]
table = ["orbit-runtime/table"]
math = ["orbit-runtime/math"]
load = ["orbit-runtime/load"]
package = ["orbit-runtime/package"]
coroutine = ["orbit-runtime/coroutine"]
debug = ["orbit-runtime/debug"]
dump = ["orbit-runtime/dump"]
verify = ["orbit-runtime/verify"]
verify-flow = ["orbit-runtime/verify-flow"]
# The debugger engine (ADR-12), for the runtime backend.
debugger = ["orbit-runtime/debugger"]
# Compile hot functions with Cranelift (a prototype, planning/jit/).
# `ORBIT_JIT=0` turns it off at run time; `ORBIT_JIT_THRESHOLD` sets how many
# calls and loop iterations make a function hot.
jit = ["orbit-runtime/jit", "dep:orbit-jit", "orbit-jit/cranelift"]
# The same with a small x86-64 template backend instead (dynasm). With both
# features, `ORBIT_JIT_BACKEND=template` picks it.
jit-template = ["orbit-runtime/jit", "dep:orbit-jit", "orbit-jit/template"]

[lints]
workspace = true
