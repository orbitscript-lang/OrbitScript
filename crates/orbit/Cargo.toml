[package]
name = "orbit"
description = "Rust embedding API for the OrbitScript runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
orbit-runtime = { path = "../orbit-runtime", default-features = false }
orbit-ffi = { path = "../orbit-ffi", optional = true }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }

[dev-dependencies]
# The verifier tests and the chunk fuzzer measure layer 2 directly.
orbit-bytecode = { path = "../orbit-bytecode", features = ["verify-flow"] }

[features]
# The standard library's optional parts (see `orbit-runtime`).
default = ["string", "utf8", "table", "math", "load", "package", "coroutine", "debug", "dump", "verify", "verify-flow"]
string = ["orbit-runtime/string"]
utf8 = ["orbit-runtime/utf8"]
table = ["orbit-runtime/table"]
math = ["orbit-runtime/math"]
load = ["orbit-runtime/load"]
package = ["orbit-runtime/package"]
coroutine = ["orbit-runtime/coroutine"]
debug = ["orbit-runtime/debug"]
dump = ["orbit-runtime/dump"]
verify = ["orbit-runtime/verify"]
verify-flow = ["orbit-runtime/verify-flow"]
# The `ffi` library: calling C functions in shared libraries (off by
# default for embedders; a host still opts in with `Isolate::enable_ffi`).
ffi = ["dep:orbit-ffi"]
# With `ffi`: link the system's shared libffi rather than a static copy built
# from bundled sources.
ffi-system-libffi = ["ffi", "orbit-ffi/system-libffi"]

[lints]
workspace = true
