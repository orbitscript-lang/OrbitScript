[package]
name = "orbit"
description = "Rust embedding API for the OrbitScript runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
orbit-lua-version = { path = "../orbit-lua-version" }
orbit-runtime = { path = "../orbit-runtime", default-features = false }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }
# `#[native]` (build time only, no dependencies of its own).
orbit-macros = { path = "../orbit-macros" }
# The C library's locales for `os.setlocale` (ADR-13).
orbit-locale = { path = "../orbit-locale", optional = true }

[dev-dependencies]
# The verifier tests and the chunk fuzzer measure layer 2 directly.
orbit-bytecode = { path = "../orbit-bytecode", features = ["verify-flow"] }

[features]
# The standard library's optional parts (see `orbit-runtime`).
default = ["locale", "string", "utf8", "table", "math", "load", "package", "coroutine", "debug", "dump", "verify", "verify-flow"]
string = ["orbit-runtime/string"]
utf8 = ["orbit-runtime/utf8"]
table = ["orbit-runtime/table"]
math = ["orbit-runtime/math"]
load = ["orbit-runtime/load"]
package = ["orbit-runtime/package"]
coroutine = ["orbit-runtime/coroutine"]
debug = ["orbit-runtime/debug"]
dump = ["orbit-runtime/dump"]
verify = ["orbit-runtime/verify"]
verify-flow = ["orbit-runtime/verify-flow"]
# `os.setlocale` with the C library's locales (ADR-13); without it
# only the C locale exists.
locale = ["dep:orbit-locale"]
# Behave as Lua 5.4 (with Lua 5.3 compatibility, as Debian builds it)
# instead of 5.5, for the whole process (ADR-14). Unlike the others this
# feature selects rather than adds: any crate enabling it makes the whole
# build 5.4, so only the final program (or `build.sh --lua 5.4`) should.
lua-5-4 = ["orbit-lua-version/lua-5-4"]
# The debugger engine (ADR-12).
debugger = ["orbit-runtime/debugger"]

[lints]
workspace = true
