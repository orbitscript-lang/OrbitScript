[package]
name = "orbit-std"
description = "The OrbitScript standard library's I/O-facing parts (io, os, print, files, searchers), built on the public API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit = { path = "../orbit", default-features = false }
orbit-ffi = { path = "../orbit-ffi", optional = true }
serde = { version = "1", default-features = false, features = ["std"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
orbit = { path = "../orbit" }

[features]
default = ["io", "os"]
# The `io` library.
io = []
# The `os` library.
os = []
# The `ffi` library: calling C functions in shared libraries (off by
# default for embedders; a host still opts in with `install_ffi`).
ffi = ["dep:orbit-ffi"]
# The `orbit.json` module: JSON encoding and decoding over `serde_json`
# (ADR-12, D13).
json = ["dep:serde", "dep:serde_json"]
# With `ffi`: link the system's shared libffi rather than a static copy built
# from bundled sources.
ffi-system-libffi = ["ffi", "orbit-ffi/system-libffi"]

[lints]
workspace = true
