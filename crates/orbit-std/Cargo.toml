[package]
name = "orbit-std"
description = "The OrbitScript standard library's I/O-facing parts (io, os, print, files, searchers), built on the public API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit = { path = "../orbit", default-features = false }
orbit-ffi = { path = "../orbit-ffi", optional = true }
serde = { version = "1", default-features = false, features = ["std"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }

[target.'cfg(windows)'.dependencies]
libc = "0.2"

[dev-dependencies]
orbit = { path = "../orbit" }

[features]
default = ["io", "os"]
# The `io` library.
io = []
# The `os` library.
os = []
# The `ffi` library: calling C functions in shared libraries (off by
# default for embedders; a host still opts in with `install_ffi`).
ffi = ["dep:orbit-ffi"]
# The `std.json` module: JSON encoding and decoding over `serde_json`
# (ADR-12, D13).
json = ["dep:serde", "dep:serde_json"]
# With `ffi`: link the system's shared libffi rather than a static copy built
# from bundled sources.
ffi-system-libffi = ["ffi", "orbit-ffi/system-libffi"]

# The workspace lints, except that `unsafe_code` is denied rather than
# forbidden, so `src/crt.rs` can allow its Windows `strerror` call
# (ADR-6). Keep the rest in step with the workspace `Cargo.toml`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
