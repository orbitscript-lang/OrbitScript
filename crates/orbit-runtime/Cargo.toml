[package]
name = "orbit-runtime"
description = "The OrbitScript runtime: values, heap, strings and tables, the bytecode interpreter, and the built-in libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Numerals and extended UTF-8, read the same way in source and by the runtime.
orbit-lua-text = { path = "../orbit-lua-text" }
orbit-bytecode = { path = "../orbit-bytecode" }
orbit-gc = { path = "../orbit-gc" }
# The Lua version (ADR-14); its `links` metadata also tells the build script.
orbit-lua-version = { path = "../orbit-lua-version" }
# `#[native]` for the built-in libraries (build time only: a proc macro).
orbit-macros = { path = "../orbit-macros" }

# The build script compiles the built-in OrbitScript modules (ADR-11); none
# of this is linked into the runtime.
[build-dependencies]
orbit-bytecode = { path = "../orbit-bytecode" }
orbit-compiler = { path = "../orbit-compiler" }
orbit-lua-version = { path = "../orbit-lua-version" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }

[dev-dependencies]
orbit-compiler = { path = "../orbit-compiler" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }

# Tests only: `string.pack`'s native alignment checked against the C
# library's `max_align_t`, where `libc` defines it.
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple", all(windows, target_env = "gnu", target_arch = "x86_64")))'.dev-dependencies]
libc = { version = "0.2", default-features = false }

# The workspace lints, except that `unsafe_code` is denied rather than
# forbidden, so `src/vm/handlers/regs.rs` and `src/vm/handlers/calls.rs`
# can allow the interpreter's raw register and code pointers (ADR-16).
# Keep the rest in step with the workspace `Cargo.toml`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
default = ["debug"]
# The `debug` library.
debug = ["hooks"]
# Debug hooks (`debug.sethook`): a second, hooked copy of the dispatch loop.
# Internal: turned on by `debug` and `debugger`.
hooks = []
# The debugger engine (ADR-12): breakpoints, stepping, pause and stops on
# errors, reported to a host's `DebugEvents`.
debugger = ["hooks"]
