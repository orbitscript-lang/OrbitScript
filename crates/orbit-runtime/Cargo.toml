[package]
name = "orbit-runtime"
description = "The OrbitScript runtime: values, heap, strings and tables, the bytecode interpreter, and the built-in libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-bytecode = { path = "../orbit-bytecode" }
orbit-gc = { path = "../orbit-gc" }

# The build script compiles the built-in OrbitScript modules (ADR-11); none
# of this is linked into the runtime.
[build-dependencies]
orbit-bytecode = { path = "../orbit-bytecode" }
orbit-compiler = { path = "../orbit-compiler" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }

[dev-dependencies]
orbit-compiler = { path = "../orbit-compiler" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }

[lints]
workspace = true

[features]
default = ["string", "utf8", "table", "math", "load", "package", "coroutine", "debug", "dump", "verify", "verify-flow"]
string = []
utf8 = []
table = []
math = []
# `load` (source chunks need the host to install a compiler in
# `Runtime::compile`).
load = []
# `string.dump`, and loading the binary chunks it writes.
dump = ["load", "string"]
# Check binary chunks before `load` links them: layer 1 of the verifier
# (structure). Without it binary chunks run unchecked, and a malformed one
# can make the VM panic. `ORBIT_VERIFY` can lower the level at run time.
verify = ["dump"]
# Layer 2 of the verifier (data flow) as well: with both layers no binary
# chunk can make the VM panic.
verify-flow = ["verify", "orbit-bytecode/verify-flow"]
# `require` and the `package` library.
package = ["load"]
# The `coroutine` library.
coroutine = []
# The `debug` library.
debug = ["hooks"]
# Debug hooks (`debug.sethook`): a second, hooked copy of the dispatch loop.
hooks = []
# The debugger engine (ADR-12): breakpoints, stepping, pause and stops on
# errors, reported to a host's `DebugEvents`.
debugger = ["hooks"]
