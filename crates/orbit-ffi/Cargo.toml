[package]
name = "orbit-ffi"
description = "Calling C functions in shared libraries from Lua and OrbitScript (the `ffi` library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-vm = { path = "../orbit-vm" }
orbit-stdlib = { path = "../orbit-stdlib", default-features = false }

# Not the workspace lints: unsafe is denied rather than forbidden, and
# allowed only in src/sys.rs (ADR-6 exception, ADR-9).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
