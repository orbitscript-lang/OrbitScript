[package]
name = "orbit-vm"
description = "Bytecode interpreter: call frames, coroutines, metamethods and errors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-bytecode = { path = "../orbit-bytecode" }
orbit-core = { path = "../orbit-core" }
orbit-gc = { path = "../orbit-gc" }

[features]
# Per-instruction type-feedback bytes on prototypes (docs/design/vm.md).
type-feedback = ["orbit-core/type-feedback"]
# ADR-3 spike only. C: shrink a stack when it yields. B: copy a yielding
# stack out to an exact buffer and back into a pooled one. D: shrink a
# parked stack once it is no longer among the last few parked.
spike-co-shrink = []
spike-co-copy = []
spike-co-lru = []

[lints]
workspace = true
