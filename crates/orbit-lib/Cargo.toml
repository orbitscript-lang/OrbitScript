[package]
name = "orbit-lib"
description = "The runtime as one shared library, liborbit, which also serves as liblua 5.5 (ADR-10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Not `orbit`: that name is the Rust API crate's, and Cargo's outputs would
# collide. Cargo builds `liborbit_lib.so`; its soname, and the name packaging
# installs it under, is `liborbit.so.0` (build.rs).
name = "orbit_lib"
# `rlib` too, so `cargo test` builds the shared library for tests/host.rs.
crate-type = ["cdylib", "rlib"]

[dependencies]
orbit = { path = "../orbit", features = ["abi"] }
orbit-capi = { path = "../orbit-capi", features = ["host"] }
orbit-std = { path = "../orbit-std", features = ["json"] }
stabby = "72.1.16"

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }

[features]
default = ["ffi"]
# The `ffi` library for the programs that install it (ADR-9). Without it
# `install_bundled_ffi` reports that the library has none.
ffi = ["orbit-std/ffi"]
# With `ffi`: link the system's shared libffi rather than a static copy built
# from bundled sources (`build.sh --system-libffi`).
system-libffi = ["ffi", "orbit-std/ffi-system-libffi"]
# The debugger engine and its API (ADR-12), for programs on the shared
# backend, and the DAP server C hosts start (`orbit_debug_listen`,
# `ORBIT_DEBUG`).
debugger = ["orbit/debugger", "orbit-capi/debugger"]
# Lua 5.4 rather than 5.5: the language, the libraries, the C API and
# headers, and liblua5.4's names (`build.sh --lua 5.4`, ADR-14).
lua-5-4 = ["orbit/lua-5-4", "orbit-capi/lua-5-4"]

[lints]
workspace = true
