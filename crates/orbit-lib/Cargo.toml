[package]
name = "orbit-lib"
description = "The runtime as one shared library, liborbit, which also serves as liblua 5.5 (ADR-10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Not `orbit`: that name is the Rust API crate's, and Cargo's outputs would
# collide. Cargo builds `liborbit_lib.so`; its soname, and the name packaging
# installs it under, is `liborbit.so.0` (build.rs).
name = "orbit_lib"
# A Rust `dylib`, not a `cdylib`: `orbit`, `orbitc` and `orbit-lsp` link it
# as a Rust crate (ADR-10). No `rlib` next to it, or rustc would link that
# into the programs instead.
crate-type = ["dylib"]

[dependencies]
orbit = { path = "../orbit" }
orbit-capi = { path = "../orbit-capi", features = ["host"] }
orbit-std = { path = "../orbit-std", features = ["json"] }
# The Lua version (ADR-14): the build script reads it from its `links`
# metadata, so this must be a direct dependency.
orbit-lua-version = { path = "../orbit-lua-version" }

[build-dependencies]
orbit-lua-version = { path = "../orbit-lua-version" }

[features]
default = ["ffi"]
# The `ffi` library for the programs that install it (ADR-9).
ffi = ["orbit-std/ffi"]
# With `ffi`: link the system's shared libffi rather than a static copy built
# from bundled sources (`build.sh --system-libffi`).
system-libffi = ["ffi", "orbit-std/ffi-system-libffi"]
# The debugger engine and its API (ADR-12), for the programs built with
# the library, and the DAP server C hosts start (`orbit_debug_listen`,
# `ORBIT_DEBUG`).
debugger = ["orbit/debugger", "orbit-capi/debugger"]
# Lua 5.4 rather than 5.5: the language, the libraries, the C API and
# headers, and liblua5.4's names (`build.sh --lua 5.4`, ADR-14).
lua-5-4 = ["orbit/lua-5-4"]

[lints]
workspace = true
