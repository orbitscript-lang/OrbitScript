[package]
name = "orbit-gc"
description = "Garbage collector for OrbitScript: typed arenas, handles and incremental mark-sweep, independent of the VM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The workspace lints, except that `unsafe_code` is denied rather than
# forbidden, so `src/os.rs` can allow its one glibc call (ADR-6). Keep the
# rest in step with the workspace `Cargo.toml`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
default = ["memory-trimming"]
# Check a generation on every handle access so a stale handle always panics
# (8-byte `Gc`). Always on in debug builds; this turns it on in release too.
# It costs about 8% in interpreter speed (measured on the Milestone 1 build).
checked-handles = []
# On supported platforms (glibc via `malloc_trim(0)`, macOS via
# `malloc_zone_pressure_relief(NULL, 0)`), ask the allocator to return freed
# memory to the OS after a collection finds the reachable heap has shrunk to
# half its peak or less and pages were released. Does nothing on other targets.
memory-trimming = []
