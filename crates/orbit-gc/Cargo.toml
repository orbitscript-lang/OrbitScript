[package]
name = "orbit-gc"
description = "Garbage collector for OrbitScript: typed arenas, handles and incremental mark-sweep, independent of the VM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The workspace lints, except that `unsafe_code` is denied rather than
# forbidden, so `src/os.rs` can allow its one glibc call (ADR-6). Keep the
# rest in step with the workspace `Cargo.toml`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
# Check a generation on every handle access so a stale handle always panics
# (8-byte `Gc`). Always on in debug builds; this turns it on in release too.
# It costs about 8% in interpreter speed (measured on the Milestone 1 build).
checked-handles = []
# On glibc, call `malloc_trim(0)` after a collection finds the reachable
# heap has shrunk to half its peak or less and pages were released, so the
# process gives the memory back to the OS (glibc keeps it otherwise). Does
# nothing on other targets.
malloc-trim = []
# Spike only (SPIKE-ephemerons.md): ephemerons by convergence instead of
# "value waits on key". Ephemeron objects whose keys are not all marked are
# revisited at the end of marking until a pass marks nothing new.
spike-ephemeron-rescan = []
# Spike only: E1 (values wait on keys) with a cheap slot hasher instead of
# SipHash and the first waiting value stored inline. Ignored together with
# `spike-ephemeron-rescan`.
spike-ephemeron-tuned = []
# Spike only: find unreachable finalizable objects by scanning the color
# bytes at the end of marking, ordered by a per-slot registration number,
# instead of keeping a list of registered objects.
spike-finalizer-scan = []
# Spike only: count and time what the spikes measure (`Heap::spike_stats`).
spike-stats = []
