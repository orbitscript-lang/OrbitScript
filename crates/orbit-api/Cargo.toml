[package]
name = "orbit-api"
description = "The OrbitScript embedding API that works across a shared-library boundary: linked statically, or reaching liborbit (ADR-10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The `static` backend: the runtime linked into the program.
orbit = { path = "../orbit", optional = true }
orbit-compiler = { path = "../orbit-compiler", optional = true }
orbit-hir = { path = "../orbit-hir", optional = true }
orbit-lua-syntax = { path = "../orbit-lua-syntax", optional = true }
orbit-orb-syntax = { path = "../orbit-orb-syntax", optional = true }
# The `shared` backend: liborbit through stabby.
orbit-abi = { path = "../orbit-abi", optional = true }
stabby = { version = "72.1.16", optional = true }

[features]
default = ["static"]
# Link the runtime into the program.
static = ["dep:orbit", "dep:orbit-compiler", "dep:orbit-hir", "dep:orbit-lua-syntax", "dep:orbit-orb-syntax"]
# Reach the runtime in liborbit. Takes precedence over `static` when both
# are on. Linking needs `liborbit_lib.so` (or the platform's name for it)
# in ORBIT_LIB_DIR, or next to the build's own output.
shared = ["dep:orbit-abi", "dep:stabby"]
# What the static runtime includes; liborbit decides for itself.
c-modules = ["orbit?/c-modules"]
ffi = ["orbit?/ffi"]
ffi-system-libffi = ["ffi", "orbit?/ffi-system-libffi"]

[lints]
workspace = true
