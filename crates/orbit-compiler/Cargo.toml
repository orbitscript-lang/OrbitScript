[package]
name = "orbit-compiler"
description = "Compiles OrbitScript HIR to register bytecode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orbit-bytecode = { path = "../orbit-bytecode" }
orbit-hir = { path = "../orbit-hir" }

[features]
# Debug information as Lua 5.4 reports it (the hidden `for` locals), for a
# build that targets Lua 5.4 (ADR-14). Enable it through `orbit`.
lua-5-4 = []

[lints]
workspace = true

[dev-dependencies]
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
