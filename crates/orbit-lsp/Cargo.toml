[package]
name = "orbit-lsp"
description = "The language server for OrbitScript and Lua (ADR-12): a small host on the orbit API whose protocol layer is OrbitScript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orbit-lsp"
path = "src/main.rs"

[dependencies]
orbit = { path = "../orbit" }
orbit-std = { path = "../orbit-std", features = ["json"] }
orbit-check = { path = "../orbit-check" }
orbit-fmt = { path = "../orbit-fmt" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
serde_json = { version = "1", default-features = false, features = ["std"] }
# liborbit, for the shared layout (`shared`).
orbit-lib = { path = "../orbit-lib", optional = true }

[features]
# The runtime in liborbit (ADR-10), as `orbit` has it in `build.sh`'s
# shared layout. Without it the runtime is linked into the program.
shared = ["dep:orbit-lib"]
# Lua 5.4 rather than 5.5 (`build.sh --lua 5.4`, ADR-14).
lua-5-4 = ["orbit/lua-5-4"]

[lints]
workspace = true
