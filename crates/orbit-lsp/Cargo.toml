[package]
name = "orbit-lsp"
description = "The language server for OrbitScript and Lua (ADR-12): a small host on the orbit API whose protocol layer is OrbitScript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orbit-lsp"
path = "src/main.rs"

[dependencies]
orbit = { path = "../orbit", default-features = false }
orbit-std = { path = "../orbit-std", features = ["json"] }
orbit-check = { path = "../orbit-check" }
orbit-fmt = { path = "../orbit-fmt" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
serde_json = { version = "1", default-features = false, features = ["std"] }

[features]
default = ["runtime"]
# The runtime linked into the program, as `orbit` has it.
runtime = ["orbit/default"]
# The runtime in liborbit instead (ADR-10), for `build.sh`'s package:
# `--no-default-features --features shared`.
shared = ["orbit/shared"]
# Lua 5.4 rather than 5.5 (`build.sh --lua 5.4`, ADR-14).
lua-5-4 = ["orbit/lua-5-4", "orbit-lua-syntax/lua-5-4"]

[lints]
workspace = true
