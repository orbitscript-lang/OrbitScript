[package]
name = "orbit-cli"
description = "Command-line interpreter for Lua 5.5 and OrbitScript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orbit"
path = "src/main.rs"

# The compiler, after `luac`: compiling, listing bytecode and the front-end
# printers live here, out of the interpreter.
[[bin]]
name = "orbitc"
path = "src/orbitc.rs"

[dependencies]
orbit = { path = "../orbit", default-features = false }
orbit-std = { path = "../orbit-std" }
orbit-capi = { path = "../orbit-capi", optional = true }
orbit-dap = { path = "../orbit-dap", optional = true }
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
# `orbitc --ast`; only orbitc links it.
orbit-lua-unparse = { path = "../orbit-lua-unparse" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }
signal-hook = "0.4.5"
# liborbit, for the shared layout (`shared`).
orbit-lib = { path = "../orbit-lib", optional = true }

# The terminal for line editing in interactive mode (`src/repl/tty.rs`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "process"], optional = true }

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }

# Finds MSVC's C compiler for the C module tests (`tests/c_modules.rs`).
[target.'cfg(windows)'.dev-dependencies]
cc = "1.2"

# A pseudo-terminal for the line editor's tests (`tests/tty.rs`).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "process", "pty", "fs"] }

[features]
default = ["locale", "debug", "c-modules", "ffi", "json", "repl", "dap"]
# The runtime in liborbit (ADR-10): the binaries link the library as a Rust
# `dylib` and hold only their own code. The library and the binaries must
# come from one build, so only `./build.sh` builds this. Without it the
# runtime is linked into each binary.
shared = ["dep:orbit-lib"]
# `os.setlocale` with the C library's locales (ADR-13).
locale = ["orbit/locale"]
# The `debug` library and debug hooks.
debug = ["orbit/debug"]
# Load C modules (on by default in the CLI).
c-modules = ["dep:orbit-capi"]
# The `ffi` library, on unless `--no-ffi` is given (ADR-9).
ffi = ["orbit-std/ffi"]
# The `std.json` module (ADR-12).
json = ["orbit-std/json"]
# Link the system's shared libffi rather than a static copy built from
# bundled sources.
ffi-system-libffi = ["ffi", "orbit-std/ffi-system-libffi"]
# Interactive mode (`-i`, or no script on a terminal), with line editing,
# history and Tab completion where the terminal allows (Unix terminals
# other than `TERM=dumb`), plain lines elsewhere. Without it, `-i` is an
# unrecognized option and a terminal on standard input is read as a
# script, as a pipe is.
repl = ["dep:rustix"]
# The debugger engine (ADR-12), without a way in yet.
debugger = ["orbit/debugger"]
# `orbit --debug-server`: run a script under an editor's debugger (ADR-12).
dap = ["debugger", "dep:orbit-dap"]
# Lua 5.4 rather than 5.5, for the language, the libraries and the C
# modules the binaries load (`build.sh --lua 5.4`, ADR-14).
lua-5-4 = ["orbit/lua-5-4"]

[lints]
workspace = true
