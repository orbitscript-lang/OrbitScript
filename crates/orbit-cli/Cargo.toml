[package]
name = "orbit-cli"
description = "Command-line interpreter for Lua 5.5 and OrbitScript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orbit"
path = "src/main.rs"

# The compiler, after `luac`: compiling, listing bytecode and the front-end
# printers live here, out of the interpreter.
[[bin]]
name = "orbitc"
path = "src/orbitc.rs"

[dependencies]
orbit = { path = "../orbit" }
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
signal-hook = "0.4.5"

[lints]
workspace = true
