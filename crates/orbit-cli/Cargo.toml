[package]
name = "orbit-cli"
description = "Command-line interpreter for Lua 5.5 and OrbitScript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
ctrlc = "3.5.2"
orbit = { path = "../orbit" }
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }

# Give memory freed after an allocation spike back to the OS (docs/design/vm.md,
# "Garbage collection"; ADR-2). Only glibc needs it.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
orbit-gc = { path = "../orbit-gc", features = ["malloc-trim"] }

[features]
default = ["c-modules"]
# Load C modules (on by default in the CLI, Tym 2026-10-09).
c-modules = ["orbit/c-modules"]

[lints]
workspace = true
