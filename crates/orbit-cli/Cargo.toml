[package]
name = "orbit-cli"
description = "Command-line interpreter for Lua 5.5 and OrbitScript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
orbit = { path = "../orbit" }

# The workspace lints, except that `unsafe_code` is denied rather than
# forbidden, so `src/memory.rs` can allow its one glibc call (ADR-6). Keep
# the rest in step with the workspace `Cargo.toml`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
