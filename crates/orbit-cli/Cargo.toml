[package]
name = "orbit-cli"
description = "Command-line interpreter for Lua 5.5 and OrbitScript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
ctrlc = "3.5.2"
orbit = { path = "../orbit" }
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }

[lints]
workspace = true
