[package]
name = "orbit-cli"
description = "Command-line interpreter for Lua 5.5 and OrbitScript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orbit"
path = "src/main.rs"

# The compiler, after `luac`: compiling, listing bytecode and the front-end
# printers live here, out of the interpreter.
[[bin]]
name = "orbitc"
path = "src/orbitc.rs"

[dependencies]
orbit = { path = "../orbit", default-features = false }
orbit-std = { path = "../orbit-std" }
orbit-capi = { path = "../orbit-capi", optional = true }
orbit-dap = { path = "../orbit-dap", optional = true }
orbit-compiler = { path = "../orbit-compiler" }
orbit-hir = { path = "../orbit-hir" }
orbit-lua-syntax = { path = "../orbit-lua-syntax" }
orbit-orb-syntax = { path = "../orbit-orb-syntax" }
signal-hook = "0.4.5"
# liborbit, for the shared layout (`shared`).
orbit-lib = { path = "../orbit-lib", optional = true }

# The terminal for line editing (`src/repl/tty.rs`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "process"], optional = true }

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }

# A pseudo-terminal for the line editor's tests (`tests/tty.rs`).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "process", "pty", "fs"] }

[features]
default = ["runtime", "c-modules", "ffi", "json", "line-editing", "dap"]
# The runtime linked into the binaries: one self-contained `orbit`.
runtime = ["orbit/default"]
# The runtime in liborbit instead (ADR-10): the binaries link the library
# as a Rust `dylib` and hold only their own code. The library and the
# binaries must come from one build, so only `./build.sh` builds this.
shared = ["dep:orbit-lib", "orbit/default"]
# Load C modules (on by default in the CLI).
c-modules = ["dep:orbit-capi"]
# The `ffi` library, on unless `--no-ffi` is given (ADR-9).
ffi = ["orbit-std/ffi"]
# The `std.json` module (ADR-12).
json = ["orbit-std/json"]
# Link the system's shared libffi rather than a static copy built from
# bundled sources.
ffi-system-libffi = ["ffi", "orbit-std/ffi-system-libffi"]
# Interactive mode (`-i`, or no script on a terminal), reading plain lines.
# Without it, `-i` is an unrecognized option and a terminal on standard
# input is read as a script, as a pipe is.
repl = []
# Line editing, history and Tab completion in interactive mode.
line-editing = ["repl", "dep:rustix"]
# The debugger engine (ADR-12), without a way in yet.
debugger = ["orbit/debugger"]
# `orbit --debug-server`: run a script under an editor's debugger (ADR-12).
dap = ["debugger", "dep:orbit-dap"]
# Lua 5.4 rather than 5.5, for the language, the libraries and the C
# modules the binaries load (`build.sh --lua 5.4`, ADR-14).
lua-5-4 = ["orbit/lua-5-4"]

[lints]
workspace = true
