# Spike S0: throwaway micro-VMs for ADR-2 (GC) and ADR-4 (dispatch).
# This is its own workspace so the spike's dependencies never reach the product crates.
[workspace]
resolver = "3"
members = ["common", "vm-arena", "vm-gcarena", "bench", "embed"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
spike-common = { path = "common" }
spike-vm-arena = { path = "vm-arena" }
spike-vm-gcarena = { path = "vm-gcarena" }
gc-arena = { version = "=0.7.0", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
