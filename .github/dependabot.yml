# Dependabot keeps dependencies current. Security updates open as soon as an
# advisory affects a dependency (they need "Dependabot security updates" on
# in the repository settings); version updates come once a month. Minor and
# patch bumps are grouped into one pull request per ecosystem, so each round
# costs one CI run; major bumps get their own pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
    ignore:
      # 3.x and later need a newer Rust than the 1.75 MSRV (DEPS.md).
      - dependency-name: libffi-sys
        versions: ['>= 3']

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
