name: debug readline
on:
  push:
    branches: [debug/readline-reference]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-reference-lua.sh
      - name: main.lua several ways
        run: |
          L=$PWD/target/reference-lua/bin/lua5.5
          cargo build --release -p orbit-testkit -q
          echo "== testkit binary directly"; target/release/orbit-testkit conformance --interp $L --c-libs target/reference-lua/libs main.lua || true
          cp -r tests/lua-5.5/suite /tmp/suite
          cp target/reference-lua/libs/*.so /tmp/suite/libs/ || true
          cd /tmp/suite
          sed -i '207s/^/print("OUTPUT[["..getoutput().."]]") do return end /' main.lua
          sed -n 200,212p main.lua
          echo "== direct"; $L main.lua 2>&1 | tail -20 || true
