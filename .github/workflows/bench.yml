name: Benchmarks

# TEMPORARY, on the measurement branch only (never merged).
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  aarch64-gate:
    name: dylib against main's shared layout (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build/dylib-liborbit
          path: dylib
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - run: cd dylib && rustup show && rustup component add llvm-tools && cargo install cargo-pgo --version 0.3.0 --locked
      - name: Build
        run: |
          o="$RUNNER_TEMP/o"
          (cd main && git log --oneline -1 && ./build.sh --pgo-train --pgo "$RUNNER_TEMP/main.profdata" --out "$o/main-shared" && ./build.sh --pgo "$RUNNER_TEMP/main.profdata" --static --out "$o/main-static")
          (cd dylib && git log --oneline -1 && ./build.sh --pgo-train --pgo "$RUNNER_TEMP/dylib.profdata" --out "$o/dylib-shared")
          ls -l "$o"/*/bin "$o"/*/lib
      - name: Benchmarks
        run: |
          o="$RUNNER_TEMP/o"
          cd dylib
          interps="--interp main-shared=$o/main-shared/bin/orbit --interp dylib-shared=$o/dylib-shared/bin/orbit --interp main-static=$o/main-static/bin/orbit"
          cargo testkit bench --runs 9 $interps --json "$RUNNER_TEMP/bench.json" --markdown "$GITHUB_STEP_SUMMARY"
          bench/apps/fetch.sh
          cargo testkit bench --suite apps --runs 7 $interps --json "$RUNNER_TEMP/apps.json" --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-${{ matrix.os }}
          path: ${{ runner.temp }}/*.json
