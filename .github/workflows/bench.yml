name: Benchmarks

# TEMPORARY, on the measurement branch only (never merged): the experiments
# the dylib liborbit plan asks for on runners we can't reach otherwise.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  layout:
    name: shared layout check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup show
      - run: tools/check-shared-layout.sh

  msrv-layout:
    name: shared layout check on Rust 1.75 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.75.0
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.75.0 --profile minimal
      - run: tools/check-shared-layout.sh

  x86-profile:
    name: train on x86_64 Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup show && rustup component add llvm-tools && cargo install cargo-pgo --version 0.3.0 --locked
      - run: ./build.sh --pgo-train --pgo "$RUNNER_TEMP/x86.profdata"
      - uses: actions/upload-artifact@v7
        with:
          name: x86-profile
          path: ${{ runner.temp }}/x86.profdata

  cross-profile:
    name: an x86_64 profile on aarch64 Linux
    needs: x86-profile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: rustup show && rustup component add llvm-tools && cargo install cargo-pgo --version 0.3.0 --locked
      - uses: actions/download-artifact@v8
        with:
          name: x86-profile
          path: ${{ runner.temp }}
      - name: What the x86_64 profile covers here
        run: |
          ./build.sh --pgo "$RUNNER_TEMP/x86.profdata" --pgo-check > check.log 2>&1 || true
          tail -n 5 check.log
          { echo '### x86_64 profile, checked on aarch64'; echo '```'; tail -n 5 check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the variants
        run: |
          o="$RUNNER_TEMP/o"
          ./build.sh --pgo "$RUNNER_TEMP/x86.profdata" --out "$o/cross"
          ./build.sh --pgo-train --pgo "$RUNNER_TEMP/native.profdata" --out "$o/native"
          ./build.sh --pgo "$RUNNER_TEMP/native.profdata" --static --out "$o/static"
          ./build.sh --no-pgo --out "$o/nopgo"
          ./build.sh --no-pgo --static --out "$o/static-nopgo"
          ls -l "$o"/*/bin "$o"/*/lib
      - name: Benchmarks
        run: |
          o="$RUNNER_TEMP/o"
          interps="--interp static-pgo=$o/static/bin/orbit --interp shared-native-pgo=$o/native/bin/orbit --interp shared-x86-profile=$o/cross/bin/orbit --interp shared-nopgo=$o/nopgo/bin/orbit --interp static-nopgo=$o/static-nopgo/bin/orbit"
          cargo testkit bench --runs 7 $interps --json bench.json --markdown "$GITHUB_STEP_SUMMARY"
          bench/apps/fetch.sh
          cargo testkit bench --suite apps --runs 5 $interps --json apps.json --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-profile-results
          path: |
            *.json
            check.log

  windows-arm64:
    name: both layouts on Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 150
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup show
      - name: Build without a profile
        run: |
          o="$RUNNER_TEMP/o"
          ./build.sh --no-pgo --static --out "$o/static"
          ./build.sh --no-pgo --out "$o/shared"
          ls -l "$o"/*/bin
      - name: Benchmarks without a profile
        run: |
          o="$RUNNER_TEMP/o"
          interps="--interp static=$o/static/bin/orbit.exe --interp shared=$o/shared/bin/orbit.exe"
          cargo testkit bench --runs 7 $interps --json bench-nopgo.json --markdown "$GITHUB_STEP_SUMMARY"
          bench/apps/fetch.sh && cargo testkit bench --suite apps --runs 5 $interps --json apps-nopgo.json --markdown "$GITHUB_STEP_SUMMARY" || echo "apps suite failed" >> "$GITHUB_STEP_SUMMARY"
      - name: Does profiling work here now?
        id: pgo
        continue-on-error: true
        run: |
          o="$RUNNER_TEMP/o"
          rustup component add llvm-tools
          cargo install cargo-pgo --version 0.3.0 --locked
          ./build.sh --pgo-train --pgo "$RUNNER_TEMP/arm.profdata" --out "$o/shared-pgo" 2>&1 | tee train.log
          ./build.sh --pgo "$RUNNER_TEMP/arm.profdata" --static --out "$o/static-pgo"
      - name: Benchmarks with the profile
        if: steps.pgo.outcome == 'success'
        continue-on-error: true
        run: |
          o="$RUNNER_TEMP/o"
          interps="--interp static=$o/static/bin/orbit.exe --interp static-pgo=$o/static-pgo/bin/orbit.exe --interp shared-pgo=$o/shared-pgo/bin/orbit.exe --interp shared=$o/shared/bin/orbit.exe"
          cargo testkit bench --runs 7 $interps --json bench-pgo.json --markdown "$GITHUB_STEP_SUMMARY"
          cargo testkit bench --suite apps --runs 5 $interps --json apps-pgo.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Profiling outcome
        run: |
          echo "### Profiling on Windows ARM64: ${{ steps.pgo.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-arm64-results
          path: |
            *.json
            train.log
