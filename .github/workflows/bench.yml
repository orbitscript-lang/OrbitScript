name: Benchmarks

# Full-size benchmark run. Results (time, peak RSS, binary size) are kept as
# a JSON artifact per commit on main, so they can be compared over time.
#
# It runs only when started by hand from the Actions tab: shared runners are
# too noisy to judge performance on every change, and the full inputs cost
# many Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: benchmarks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Cache the reference interpreter
        uses: actions/cache@v4
        with:
          path: target/reference-lua
          key: reference-lua-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/lua-5.5/VERSION', 'scripts/build-reference-lua.sh') }}
      - name: Build reference lua5.5
        run: scripts/build-reference-lua.sh
      - run: cargo build --release --locked -p orbit-cli -p orbit-testkit
      - name: Run benchmarks
        run: >
          cargo testkit bench --runs 5
          --interp lua5.5=target/reference-lua/bin/lua5.5 --interp orbit=target/release/orbit
          --json target/testkit/bench.json --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: target/testkit/bench.json
