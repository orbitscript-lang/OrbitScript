name: Benchmarks

# TEMPORARY, on the measurement branch only (never merged).
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static-programs:
    name: static programs and a C-only liborbit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup show
      - run: ./build.sh --no-pgo --static-programs --out "$RUNNER_TEMP/sp"
      - run: |
          ls -l "$RUNNER_TEMP/sp"/*
          "$RUNNER_TEMP/sp/bin/orbit" -e 'print(("orbit"):upper(), 6 * 7)'
          "$RUNNER_TEMP/sp/bin/orbitc" -v
          "$RUNNER_TEMP/sp/bin/orbit-lsp" --version
      - run: ORBIT_BIN_DIR="$RUNNER_TEMP/sp/bin" cargo test --locked -p orbit-cli -p orbit-lsp
