name: CI

# Checks every pull request into main. Sized to keep Actions minutes low:
#
# - A new push to a pull request cancels its running checks (concurrency).
# - Draft pull requests and changes that touch only docs skip it; marking a
#   draft ready for review starts it.
# - Every supported OS runs the tests once: Linux on x86_64 and aarch64,
#   macOS on arm64, Windows on x64. Windows ARM64 runs clippy, which compiles
#   everything including the tests, and the release workflow runs its tests.
# - Each Lua version's build (ADR-14) runs its official suite once, on
#   Linux x86_64 (`conformance`), and the differential tests run against
#   the 5.5 build. The Lua 5.4 build is linted and tested on Linux x86_64
#   only, and the MSRV job type-checks it too.
# - Steps several jobs share live in .github/actions: `setup-rust` (the
#   toolchain and the build cache) and `reference-lua` (the reference
#   interpreter and what the suite needs from the runner).
# - The MSRV job only type-checks (`cargo check`): no linking, no tests.
#
# bench.yml (full benchmarks) and release.yml (every target, tests and
# packaging) run by hand or on a tag, not on pull requests.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'editors/**'
      - '.github/dependabot.yml'
      - '.github/workflows/bench.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/vscode.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: fmt + clippy
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The shared backend (`liborbit` through stabby): `--workspace` always picks `runtime`.
      - run: cargo clippy -p orbit --no-default-features --features shared --all-targets --locked -- -D warnings
      # The Lua 5.4 build (ADR-14), in its own target directory so it doesn't
      # rebuild the 5.5 one.
      - run: cargo clippy --workspace --all-targets --locked --features orbit/lua-5-4 --target-dir target/lua54 -- -D warnings

  msrv:
    name: check on MSRV
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the MSRV from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # Type-checking catches newer language features and std APIs; linking
      # and running the tests add nothing the other jobs don't cover.
      - run: cargo +"$MSRV" check --workspace --all-targets --locked
      - name: The Lua 5.4 build
        run: cargo +"$MSRV" check --workspace --all-targets --locked --features orbit/lua-5-4 --target-dir target/lua54

  test:
    name: test (${{ matrix.name }})
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux x86_64, Lua 5.4
            os: ubuntu-latest
            features: orbit/lua-5-4
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Windows runners check text files out with CRLF line ends, but tests
      # compare output byte for byte and programs embed their .orb sources.
      - name: Check out with LF line ends
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.features }}
      - run: cargo test --workspace --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

  windows-arm64:
    name: clippy (Windows ARM64)
    if: github.event.pull_request.draft != true
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Check out with LF line ends
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      # Lints the Windows-only code paths and compiles every test target.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  conformance:
    name: Lua ${{ matrix.lua }} suites${{ matrix.lua == '5.5' && ', differential tests' || '' }}, size
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.5', '5.4']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUA: ${{ matrix.lua }}
      # Selects the build's Lua version (ADR-14); empty for 5.5.
      FEATURES: ${{ matrix.lua == '5.4' && '--features orbit/lua-5-4' || '' }}
      # Soft goal from the plan: runtime plus stdlib well under 10 MiB.
      SIZE_BUDGET_BYTES: 10485760
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lua${{ matrix.lua }}
      - id: reference
        uses: ./.github/actions/reference-lua
        with:
          lua: ${{ matrix.lua }}
      - run: cargo build --release --locked -p orbit-cli -p orbit-lib -p orbit-testkit $FEATURES
      - name: Release orbit binary size
        run: |
          size=$(stat -c %s target/release/orbit)
          echo "### Release \`orbit\` binary (Lua $LUA): $size bytes ($((size / 1024)) KiB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$SIZE_BUDGET_BYTES" ]; then
            echo "::error::orbit is $size bytes, over the $SIZE_BUDGET_BYTES byte budget"
            exit 1
          fi
      # Real Lua must pass every file: this checks the harness and manifest.
      - name: Suite against lua${{ matrix.lua }}
        run: >
          cargo testkit conformance --lua "$LUA" --interp "$REF/bin/lua$LUA"
          --c-libs "$REF/libs" --json "target/testkit/conformance-lua$LUA.json"
        env:
          REF: ${{ steps.reference.outputs.dir }}
      # orbit fails only on regressions against the expected-pass list.
      - name: Suite against orbit
        run: >
          cargo testkit conformance --lua "$LUA" --interp target/release/orbit
          --c-libs "$REF/libs" --expect "tests/lua-$LUA/expected-orbit.txt"
          --json target/testkit/conformance-orbit.json
        env:
          REF: ${{ steps.reference.outputs.dir }}
      # PUC's own lua.c, built for libluaX.Y, on liborbit (ADR-10).
      - name: Suite through liblua${{ matrix.lua }}
        run: >
          cargo testkit liblua --lua "$LUA" --lib target/release/liborbit_lib.so
          --c-libs "$REF/libs" --expect "tests/lua-$LUA/expected-liblua.txt"
        env:
          REF: ${{ steps.reference.outputs.dir }}
      # tests/diff compares orbit with lua5.5.
      - name: Differential tests against lua5.5
        if: matrix.lua == '5.5'
        run: >
          cargo testkit diff --reference target/reference-lua/bin/lua5.5
          --interp target/release/orbit --expect tests/diff/expected-orbit.txt
      - name: Compatibility programs against lua5.5
        if: matrix.lua == '5.5'
        run: >
          cargo testkit diff --corpus tests/diff/compat --reference target/reference-lua/bin/lua5.5
          --interp target/release/orbit --expect tests/diff/compat/expected-orbit.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: conformance-results-lua${{ matrix.lua }}
          path: target/testkit/*.json
