name: CI

# Checks every pull request into main on Linux x86_64. platforms.yml runs the
# other operating systems. Sized to keep Actions minutes low: jobs are billed
# by the whole minute and most of these take two to six, so each job does
# several things instead of one runner per step.
#
# - A new push to a pull request cancels its running checks (concurrency).
# - Draft pull requests and changes that touch only docs skip it; marking a
#   draft ready for review starts it.
# - `lint-msrv`: fmt, clippy for both Lua versions (ADR-14), and the MSRV
#   (`cargo check` with the rust-version from Cargo.toml: catches newer
#   language features and std APIs) for both, plus the shared layout
#   (ADR-10) built, linked and tested as laid out with the MSRV, and
#   docs/features.md checked against the crates' features.
# - `conformance`, once per Lua version: `cargo test` for that build, then
#   its official suite on `orbit`, on the shared layout's `orbit` and
#   through its liblua, the size budget, and for 5.5 the differential tests.
#   The corpus tests that platforms.yml skips run here.
# - `features`: every crate linted with each of its Cargo features on its
#   own (cargo-hack), the tests of the runtime crates without their default
#   features, and the slim `build.sh --no-ffi --no-debugger` build through
#   the 5.5 suite (docs/features.md).
# - `gc-verify`: a debug `orbit` runs the 5.5 suite, the differential tests,
#   the compatibility programs and the examples under GC stress mode with
#   the heap verifier on (tests/README.md, "The heap verifier"): a missed
#   write barrier fails here even when the release build's run passes.
#   Then an optimized `orbit` with orbit-gc's checked handles runs the 5.5
#   suite and the differential tests: a stale handle panics there instead
#   of reading a reused slot, in the build the release profile makes.
# - Steps several jobs share live in .github/actions: `setup-rust` (the
#   toolchain and the build cache) and `reference-lua` (the reference
#   interpreter and what the suite needs from the runner).
#
# bench.yml (full benchmarks) and release.yml (every target, tests and
# packaging) run by hand or on a tag, not on pull requests.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'editors/**'
      - '.github/dependabot.yml'
      - '.github/workflows/bench.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/sanitizers.yml'
      - '.github/workflows/vscode.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash


jobs:
  lint-msrv:
    name: fmt, clippy, MSRV
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install the MSRV from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      # Each later step runs even when an earlier one fails, so one run
      # reports every problem.
      - run: cargo fmt --all --check
      - name: docs/features.md lists every feature
        if: success() || failure()
        run: tools/check-features.sh
      - if: success() || failure()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Lua 5.4 build (ADR-14), in its own target directory so it doesn't
      # rebuild the 5.5 one.
      - if: success() || failure()
        run: cargo clippy --workspace --all-targets --locked --features orbit/lua-5-4 --target-dir target/lua54 -- -D warnings
      # Type-checking with the MSRV catches newer language features and std
      # APIs; the tests run with the current toolchain.
      - name: MSRV check
        if: success() || failure()
        run: cargo +"$MSRV" check --workspace --all-targets --locked
      - name: MSRV check, the Lua 5.4 build
        if: success() || failure()
        run: cargo +"$MSRV" check --workspace --all-targets --locked --features orbit/lua-5-4 --target-dir target/lua54
      # liborbit as a Rust `dylib` with the programs that link it, built with
      # the MSRV: the library swap, the programs' tests and the C host tests,
      # all on the layout.
      - name: Shared layout with the MSRV
        if: success() || failure()
        run: RUSTUP_TOOLCHAIN="$MSRV" tools/check-shared-layout.sh

  conformance:
    name: Lua ${{ matrix.lua }} tests, suites${{ matrix.lua == '5.5' && ', differential tests' || '' }}, size
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.5', '5.4']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUA: ${{ matrix.lua }}
      # Selects the build's Lua version (ADR-14); empty for 5.5.
      FEATURES: ${{ matrix.lua == '5.4' && '--features orbit/lua-5-4' || '' }}
      # Soft goal from the plan: runtime plus stdlib well under 10 MiB.
      SIZE_BUDGET_BYTES: 10485760
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lua${{ matrix.lua }}
      # Every test, including the corpus tests platforms.yml skips.
      - run: cargo test --workspace --locked $FEATURES
      - id: reference
        if: success() || failure()
        uses: ./.github/actions/reference-lua
        with:
          lua: ${{ matrix.lua }}
      - id: build
        if: success() || failure()
        run: cargo build --release --locked -p orbit-cli -p orbit-testkit $FEATURES
      # The shared layout (ADR-10), without a profile.
      - id: layout
        if: success() || failure()
        run: |
          ./build.sh --lua "$LUA" --no-pgo
          echo "LAYOUT=target/package${{ matrix.lua == '5.4' && '-lua5.4' || '' }}/out" >> "$GITHUB_ENV"
      - name: Release orbit binary size
        if: steps.build.outcome == 'success'
        run: |
          size=$(stat -c %s target/release/orbit)
          echo "### Release \`orbit\` binary (Lua $LUA): $size bytes ($((size / 1024)) KiB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$SIZE_BUDGET_BYTES" ]; then
            echo "::error::orbit is $size bytes, over the $SIZE_BUDGET_BYTES byte budget"
            exit 1
          fi
      # Real Lua must pass every file: this checks the harness and manifest.
      - name: Suite against lua${{ matrix.lua }}
        if: steps.reference.outcome == 'success' && steps.build.outcome == 'success'
        run: >
          cargo testkit conformance --lua "$LUA" --interp "$REF/bin/lua$LUA"
          --c-libs "$REF/libs" --json "target/testkit/conformance-lua$LUA.json"
        env:
          REF: ${{ steps.reference.outputs.dir }}
      # orbit fails only on regressions against the expected-pass list.
      - name: Suite against orbit
        if: steps.reference.outcome == 'success' && steps.build.outcome == 'success'
        run: >
          cargo testkit conformance --lua "$LUA" --interp target/release/orbit
          --c-libs "$REF/libs" --expect "tests/lua-$LUA/expected-orbit.txt"
          --json target/testkit/conformance-orbit.json
        env:
          REF: ${{ steps.reference.outputs.dir }}
      # The same list for the `orbit` that links liborbit.
      - name: Suite against the shared layout's orbit
        if: steps.reference.outcome == 'success' && steps.layout.outcome == 'success'
        run: >
          cargo testkit conformance --lua "$LUA" --interp "$LAYOUT/bin/orbit"
          --c-libs "$REF/libs" --expect "tests/lua-$LUA/expected-orbit.txt"
          --json target/testkit/conformance-orbit-shared.json
        env:
          REF: ${{ steps.reference.outputs.dir }}
      # PUC's own lua.c, built for libluaX.Y, on liborbit (ADR-10).
      - name: Suite through liblua${{ matrix.lua }}
        if: steps.reference.outcome == 'success' && steps.layout.outcome == 'success'
        run: >
          cargo testkit liblua --lua "$LUA" --lib "$LAYOUT/lib/liborbit.so.0"
          --c-libs "$REF/libs" --expect "tests/lua-$LUA/expected-liblua.txt"
        env:
          REF: ${{ steps.reference.outputs.dir }}
      # tests/diff compares orbit with lua5.5.
      - name: Differential tests against lua5.5
        if: matrix.lua == '5.5' && steps.reference.outcome == 'success' && steps.build.outcome == 'success'
        run: >
          cargo testkit diff --reference target/reference-lua/bin/lua5.5
          --interp target/release/orbit --expect tests/diff/expected-orbit.txt
      - name: Compatibility programs against lua5.5
        if: matrix.lua == '5.5' && steps.reference.outcome == 'success' && steps.build.outcome == 'success'
        run: >
          cargo testkit diff --corpus tests/diff/compat --reference target/reference-lua/bin/lua5.5
          --interp target/release/orbit --expect tests/diff/compat/expected-orbit.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: conformance-results-lua${{ matrix.lua }}
          path: target/testkit/*.json

  features:
    name: Each feature alone, slim builds
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_HACK_VERSION: 0.6.46
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: features
      # The release binary, rather than building it from source each run.
      - name: Install cargo-hack
        run: >
          curl -fsSL "https://github.com/taiki-e/cargo-hack/releases/download/v$CARGO_HACK_VERSION/cargo-hack-x86_64-unknown-linux-gnu.tar.gz"
          | tar xzf - -C "$HOME/.cargo/bin"
      # Each crate built as a package of its own, so a crate that leans on
      # a feature another crate turns on fails here. Without dev-dependencies,
      # which cargo-hack removes from the manifests while it runs (so no
      # --locked: the lock file changes until it puts them back).
      - name: Clippy with each feature on its own
        run: cargo hack clippy --workspace --each-feature --no-dev-deps -- -D warnings
      - name: Tests without default features
        if: success() || failure()
        run: cargo test --locked --no-default-features -p orbit-runtime -p orbit -p orbit-std
      # What a distribution without libffi or the debugger ships, through
      # the suite. The expected-pass list needs no C libraries from the
      # reference build.
      - id: slim
        if: success() || failure()
        run: |
          ./build.sh --static --no-pgo --no-ffi --no-debugger --out target/slim
          cargo build --release --locked -p orbit-testkit
      - name: Suite against the slim orbit
        if: steps.slim.outcome == 'success'
        run: >
          cargo testkit conformance --lua 5.5 --interp target/slim/bin/orbit
          --expect tests/lua-5.5/expected-orbit.txt

  gc-verify:
    name: Suites under GC stress mode and the heap verifier, and with checked handles
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: gc-verify
      - id: reference
        uses: ./.github/actions/reference-lua
        with:
          lua: '5.5'
      # The verifier is in debug builds only; the test tool is built for
      # release as usual.
      - id: build
        run: |
          cargo build --locked -p orbit-cli
          cargo build --release --locked -p orbit-testkit
      - name: Suite, stress mode and verifier
        if: steps.reference.outcome == 'success' && steps.build.outcome == 'success'
        run: >
          cargo testkit conformance --lua 5.5 --interp target/debug/orbit
          --c-libs "$REF/libs" --expect tests/lua-5.5/expected-orbit.txt
        env:
          REF: ${{ steps.reference.outputs.dir }}
          ORBIT_GC_STRESS: '1'
          ORBIT_GC_VERIFY: '1'
      - name: Differential tests, stress mode and verifier
        if: (success() || failure()) && steps.reference.outcome == 'success' && steps.build.outcome == 'success'
        run: >
          cargo testkit diff --reference "$REF/bin/lua5.5"
          --interp target/debug/orbit --expect tests/diff/expected-orbit.txt
        env:
          REF: ${{ steps.reference.outputs.dir }}
          ORBIT_GC_STRESS: '1'
          ORBIT_GC_VERIFY: '1'
      # c4_gc_collectgarbage.lua prints what one explicit generational step
      # frees, which depends on when the collections before it ran, so
      # stress mode changes it: it is left out of the expected list here.
      - name: Compatibility programs, stress mode and verifier
        if: (success() || failure()) && steps.reference.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          grep -v '^c4_gc_collectgarbage\.lua$' tests/diff/compat/expected-orbit.txt > target/compat-expected-stress.txt
          cargo testkit diff --corpus tests/diff/compat --reference "$REF/bin/lua5.5" \
            --interp target/debug/orbit --expect target/compat-expected-stress.txt
        env:
          REF: ${{ steps.reference.outputs.dir }}
          ORBIT_GC_STRESS: '1'
          ORBIT_GC_VERIFY: '1'
      - name: Examples, stress mode and verifier
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: cargo testkit examples --interp target/debug/orbit
        env:
          ORBIT_GC_STRESS: '1'
          ORBIT_GC_VERIFY: '1'
      # Checked handles are on in debug builds; this is the optimized build
      # with them, in its own target directory.
      - id: checked
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: >
          cargo build --release --locked -p orbit-cli -p orbit-gc
          --features orbit-gc/checked-handles --target-dir target/checked
      - name: Suite, release build with checked handles
        if: (success() || failure()) && steps.reference.outcome == 'success' && steps.checked.outcome == 'success'
        run: >
          cargo testkit conformance --lua 5.5 --interp target/checked/release/orbit
          --c-libs "$REF/libs" --expect tests/lua-5.5/expected-orbit.txt
        env:
          REF: ${{ steps.reference.outputs.dir }}
      - name: Differential tests, release build with checked handles
        if: (success() || failure()) && steps.reference.outcome == 'success' && steps.checked.outcome == 'success'
        run: >
          cargo testkit diff --reference "$REF/bin/lua5.5"
          --interp target/checked/release/orbit --expect tests/diff/expected-orbit.txt
        env:
          REF: ${{ steps.reference.outputs.dir }}
