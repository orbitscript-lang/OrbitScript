name: CI

# Automatic runs are paused while the repo is private, to save Actions
# minutes. Run it by hand from the Actions tab if needed. To re-enable,
# restore:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # The shared backend (`liborbit` through stabby): `--workspace` always picks `runtime`.
      - run: cargo clippy -p orbit --no-default-features --features shared --all-targets --locked
      # Features no workspace build turns on, so nothing else compiles them.
      - run: cargo clippy -p orbit-runtime --features type-feedback --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --workspace --locked

  msrv:
    name: build on MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the MSRV from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - run: cargo +"$MSRV" build --workspace --locked

  aarch64-linux:
    name: test (aarch64 Linux via QEMU)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: cargo test --workspace --locked --target aarch64-unknown-linux-gnu

  size:
    name: binary size
    runs-on: ubuntu-latest
    env:
      # Soft goal from the plan: runtime plus stdlib well under 10 MiB.
      SIZE_BUDGET_BYTES: 10485760
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release --locked -p orbit-cli
      - name: Report and check size
        run: |
          size=$(stat -c %s target/release/orbit)
          echo "### Release \`orbit\` binary: $size bytes ($((size / 1024)) KiB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$SIZE_BUDGET_BYTES" ]; then
            echo "::error::orbit is $size bytes, over the $SIZE_BUDGET_BYTES byte budget"
            exit 1
          fi

  conformance:
    name: Lua 5.5 test suite + differential tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Check the vendored test suite is unmodified
        working-directory: tests/lua-5.5/suite
        run: sha256sum --check --quiet ../SHA256SUMS
      - name: Cache the reference interpreter
        uses: actions/cache@v4
        with:
          path: target/reference-lua
          key: reference-lua-${{ runner.os }}-${{ hashFiles('tests/lua-5.5/VERSION', 'scripts/build-reference-lua.sh') }}
      - name: Build reference lua5.5
        run: scripts/build-reference-lua.sh
      - run: cargo build --release --locked -p orbit-cli -p orbit-testkit
      # Real Lua must pass every file: this checks the harness and manifest.
      - name: Suite against lua5.5
        run: >
          cargo testkit conformance --interp target/reference-lua/bin/lua5.5
          --c-libs target/reference-lua/libs --json target/testkit/conformance-lua5.5.json
      # orbit fails only on regressions against the expected-pass list.
      - name: Suite against orbit
        run: >
          cargo testkit conformance --interp target/release/orbit
          --expect tests/lua-5.5/expected-orbit.txt --json target/testkit/conformance-orbit.json
      - name: Differential tests against lua5.5
        run: >
          cargo testkit diff --reference target/reference-lua/bin/lua5.5
          --interp target/release/orbit --expect tests/diff/expected-orbit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: target/testkit/*.json

  bench:
    name: benchmarks (quick inputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Cache the reference interpreter
        uses: actions/cache@v4
        with:
          path: target/reference-lua
          key: reference-lua-${{ runner.os }}-${{ hashFiles('tests/lua-5.5/VERSION', 'scripts/build-reference-lua.sh') }}
      - name: Build reference lua5.5
        run: scripts/build-reference-lua.sh
      - run: cargo build --release --locked -p orbit-cli -p orbit-testkit
      # Shared runners are noisy: this is a smoke run that reports time,
      # peak RSS and binary size. bench.yml runs the full inputs.
      - name: Run benchmarks
        run: >
          cargo testkit bench --quick --runs 3
          --interp lua5.5=target/reference-lua/bin/lua5.5 --interp orbit=target/release/orbit
          --json target/testkit/bench.json --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-quick
          path: target/testkit/bench.json
